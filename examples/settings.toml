# Copy this file to the platform-specific tradefog configuration path.
# Replace every "!required" marker before using the related feature.

[application]
app_name = "Tradefog"
debug = false
secret_key = "!required"
cors_origins = ["http://localhost:3000", "http://localhost:5173", "http://127.0.0.1:8000"]

[authentication]
jwt_secret_key = "!required"
algorithm = "HS256"
access_token_expire_minutes = 15
refresh_token_expire_days = 7

[frontend]
# Optional directory containing index.html and compiled assets.
# path = "/path/to/frontend/dist"

[database]
active = "sqlite"

[database.sqlite]
# Default: <XDG_DATA_HOME>/tradefog/tradefog.db
# path = "/path/to/tradefog.db"

[database.psql]
name = "tradefog"
user = "tradefog"
password = "!required"
host = "localhost"
port = 5432

[logging]
level = "INFO"

[media]
# Files are private and served only through authenticated API endpoints.
# Maximum size of one trade attachment in MiB. Set to 0 for no app limit.
max_attachment_size_mib = 10
# Default: <XDG_DATA_HOME>/tradefog/media
# root = "/path/to/media"

[uvicorn]
host = "127.0.0.1"
port = 8000
reload = false
workers = 1
