[project]
name = "tradefog"
version = "0.1.0"
description = "A self-hosted journal for deliberate trading under uncertainty"
requires-python = ">=3.13"
dependencies = [
  "aiofiles>=24.1,<25",
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "loguru>=0.7,<1",
  "platformdirs>=4,<5",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyjwt>=2.10,<3",
  "python-multipart>=0.0.18,<1",
  "rich>=13,<14",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
tradefog = "tradefog.cli:main"

[dependency-groups]
dev = [
  "basedpyright>=1.27,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling", "editables"]
build-backend = "hatchling.build"

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.13"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportMissingTypeStubs = false
reportAny = false
reportExplicitAny = false
reportUnusedFunction = false
reportUnusedClass = false

[tool.hatch.build.targets.wheel]
packages = ["src/tradefog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 79
target-version = "py313"
