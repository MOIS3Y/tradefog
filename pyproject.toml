[project]
name = "tradefog"
version = "0.1.0"
description = "A self-hosted journal for deliberate trading under uncertainty"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-htmx>=1.29,<2",
    "django-typer>=3.8,<4",
    "httpx>=0.28,<1",
    "markdown-it-py>=4,<5",
    "platformdirs>=4,<5",
    "psycopg[binary]>=3,<4",
    "pydantic-settings>=2,<3",
    "rich>=15,<16",
    "starlette>=1,<2",
    "typer>=0.23.1,<0.26",
    "uvicorn>=0.52,<0.53",
]

[project.scripts]
tradefog = "tradefog.__main__:main"

[dependency-groups]
dev = [
    "basedpyright>=1.39,<2",
    "django-types>=0.24,<1",
    "pytest>=9,<10",
    "pytest-django>=4.14,<5",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["hatchling", "editables"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradefog"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 79
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["I001", "RUF012", "FURB157"]

[tool.basedpyright]
reportAny = "none"
reportExplicitAny = "none"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tradefog.settings"
