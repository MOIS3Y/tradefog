{% load i18n %}
<form hx-post="{% url 'journal:wallet_asset_add' venue.pk %}"
      hx-target="#wallet-asset-form-body"
      hx-swap="innerHTML"
      novalidate>
  {% csrf_token %}
  {% include "tradefog/components/form_field.html" with field=form.asset %}
  <div class="modal-footer px-0 pb-0">
    <button class="btn" type="button" data-bs-dismiss="modal">
      {% translate "Cancel" %}
    </button>
    <button class="btn btn-primary" type="submit">
      {% translate "Add wallet asset" %}
    </button>
  </div>
</form>
