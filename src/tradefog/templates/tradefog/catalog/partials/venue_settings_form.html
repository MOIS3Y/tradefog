{% load i18n %}
<form hx-post="{% url 'journal:venue_edit' venue.pk %}"
      hx-target="#venue-settings-body"
      hx-swap="innerHTML"
      novalidate>
  {% csrf_token %}
  {% include "tradefog/components/form_field.html" with field=form.name %}
  {% include "tradefog/components/form_field.html" with field=form.website %}
  <div class="mt-3">
    <button class="btn btn-primary" type="submit">
      {% include "tradefog/components/icon.html" with name="circle-check" class="icon" %}
      {% translate "Save changes" %}
    </button>
  </div>
</form>
