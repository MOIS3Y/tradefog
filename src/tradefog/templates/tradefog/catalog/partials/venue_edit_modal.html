{% load i18n %}
<div class="modal modal-blur fade"
     id="venue-edit-modal"
     tabindex="-1"
     aria-labelledby="venue-edit-modal-title"
     aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="venue-edit-modal-title">
          {% translate "Edit venue" %}
        </h2>
        <button class="btn-close"
                type="button"
                data-bs-dismiss="modal"
                aria-label="{% translate 'Close' %}"></button>
      </div>
      <div class="modal-body" id="venue-edit-body"></div>
    </div>
  </div>
</div>
