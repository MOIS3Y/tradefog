{% load i18n %}
<div id="venue-identity"{% if swap_oob %} hx-swap-oob="outerHTML"{% endif %}>
  <div class="card mb-3">
    <div class="card-body">
      <div class="d-flex align-items-start justify-content-between gap-3">
        <div>
          <div class="text-secondary text-uppercase small mb-1">
            {% translate "Venue" %}
          </div>
          <h2 class="mb-1">{{ venue.name }}</h2>
          {% if venue.website %}
            <a class="text-secondary"
               href="{{ venue.website }}"
               target="_blank"
               rel="noopener noreferrer">
              {% include "tradefog/components/icon.html" with name="device-desktop" class="icon-inline" %}
              {{ venue.website }}
            </a>
          {% else %}
            <span class="text-secondary">&mdash;</span>
          {% endif %}
        </div>
        {% if can_manage %}
          <button class="btn"
                  type="button"
                  data-bs-toggle="modal"
                  data-bs-target="#venue-edit-modal"
                  hx-get="{% url 'journal:venue_edit' venue.pk %}"
                  hx-target="#venue-edit-body"
                  hx-swap="innerHTML">
            {% include "tradefog/components/icon.html" with name="pencil" class="icon" %}
            {% translate "Edit" %}
          </button>
        {% endif %}
      </div>
    </div>
  </div>
</div>
