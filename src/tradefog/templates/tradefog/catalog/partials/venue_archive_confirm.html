{% load i18n %}
<form hx-post="{% url 'journal:venue_archive' venue.pk %}"
      hx-target="#venue-archive-body"
      hx-swap="innerHTML">
  {% csrf_token %}
  <p class="mb-3">
    {% blocktranslate with name=venue.name %}
      Archive the venue {{ name }}? It will be moved to the catalog archives and excluded from new profile creation.
    {% endblocktranslate %}
  </p>
  <div class="modal-footer px-0 pb-0">
    <button class="btn" type="button" data-bs-dismiss="modal">
      {% translate "Cancel" %}
    </button>
    <button class="btn btn-primary" type="submit">
      {% translate "Archive" %}
    </button>
  </div>
</form>
