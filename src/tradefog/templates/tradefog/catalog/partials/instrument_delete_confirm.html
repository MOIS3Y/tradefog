{% load i18n %}
<form hx-post="{% url 'journal:instrument_delete' venue.pk instrument.pk %}"
      hx-target="#instrument-delete-body"
      hx-swap="innerHTML">
  {% csrf_token %}
  <p class="mb-3">
    {% blocktranslate with pair=instrument.pair.canonical_symbol product=instrument.get_product_display %}
      Remove the {{ product }} instrument {{ pair }} from this venue?
    {% endblocktranslate %}
  </p>
  <div class="modal-footer px-0 pb-0">
    <button class="btn" type="button" data-bs-dismiss="modal">
      {% translate "Cancel" %}
    </button>
    <button class="btn btn-danger" type="submit">
      {% translate "Remove" %}
    </button>
  </div>
</form>
