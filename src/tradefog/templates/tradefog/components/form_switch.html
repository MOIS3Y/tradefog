{% load i18n %}
<div class="mb-3{% if field.errors %} tf-field-invalid{% endif %}">
  <label class="form-check form-switch" for="{{ field.id_for_label }}">
    <input class="form-check-input"
           type="checkbox"
           role="switch"
           id="{{ field.id_for_label }}"
           name="{{ field.html_name }}"
           {% if field.value %}checked{% endif %}>
    <span class="form-check-label">{{ field.label }}</span>
  </label>
  {% if field.help_text %}
    <div class="form-hint">{{ field.help_text }}</div>
  {% endif %}
  {% for error in field.errors %}
    <div class="invalid-feedback d-block">{{ error }}</div>
  {% endfor %}
</div>
