{% load formats i18n %}
<div id="trade-cascading-options">
  {% if is_new %}
    <select class="form-select"
            id="trade-strategy"
            name="strategy"
            hx-swap-oob="true"
            hx-post="{% url 'journal:trade_plan_preview' %}"
            hx-target="#trade-plan"
            hx-swap="outerHTML"
            hx-include="#trade-form"
            hx-trigger="change">
      {% for strategy in strategies %}
        <option value="{{ strategy.pk }}" {% if selected_strategy_id and strategy.pk|stringformat:"s" == selected_strategy_id %}selected{% endif %}>
          {{ strategy.name }} ({{ strategy.risk_percent|compact }}%, 1:{{ strategy.reward_multiple|compact }} R)
        </option>
      {% empty %}
        <option value="">{% translate "No active strategies for this profile" %}</option>
      {% endfor %}
    </select>
  {% endif %}

  <select class="form-select"
          id="trade-product-kind"
          name="product_kind"
          hx-swap-oob="true"
          hx-get="{% url 'journal:trade_options' %}{% if not is_new %}?is_new=0{% endif %}"
          hx-include="#trade-form"
          hx-target="#trade-cascading-options"
          hx-trigger="change">
    {% for val, lbl in product_kinds %}
      <option value="{{ val }}" {% if selected_product_kind == val %}selected{% endif %}>
        {{ lbl }}
      </option>
    {% empty %}
      <option value="">{% translate "No available markets" %}</option>
    {% endfor %}
  </select>

  <select class="form-select"
          id="trade-instrument"
          name="venue_instrument"
          hx-swap-oob="true"
          hx-post="{% url 'journal:trade_market_preview' %}"
          hx-target="#market-context"
          hx-include="#trade-form"
          hx-trigger="change">
    {% for inst in instruments %}
      <option value="{{ inst.pk }}"
              data-product="{{ inst.product }}"
              {% if selected_instrument_id and inst.pk|stringformat:"s" == selected_instrument_id %}selected{% endif %}>
        {{ inst.pair.canonical_symbol }}
      </option>
    {% empty %}
      <option value="">{% translate "No compatible instruments" %}</option>
    {% endfor %}
  </select>

  {% if context_bar %}
    {% include "tradefog/trades/partials/context_bar.html" with context_bar=context_bar hx_swap_oob="true" %}
  {% endif %}
</div>
