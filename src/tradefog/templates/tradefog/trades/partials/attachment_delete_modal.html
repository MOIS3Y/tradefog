{% load i18n %}
<div class="modal modal-blur fade"
     id="attachment-delete-modal"
     tabindex="-1"
     aria-labelledby="attachment-delete-title"
     aria-hidden="true">
  <div class="modal-dialog modal-sm modal-dialog-centered" role="document">
    <div class="modal-content">
      <form method="post"
            action="#"
            data-attachment-delete-form
            data-delete-error="{% translate 'The attachment could not be deleted. Try again.' %}">
        {% csrf_token %}
        <div class="modal-header">
          <h2 class="modal-title" id="attachment-delete-title">
            {% translate "Delete attachment?" %}
          </h2>
          <button class="btn-close"
                  type="button"
                  data-bs-dismiss="modal"
                  aria-label="{% translate 'Close' %}"></button>
        </div>
        <div class="modal-body">
          <p class="mb-0">
            <strong data-attachment-delete-name></strong>
            {% translate "will be permanently removed from this trade." %}
          </p>
          <div class="alert alert-danger mt-3 mb-0 d-none"
               role="alert"
               data-attachment-delete-error></div>
        </div>
        <div class="modal-footer">
          <button class="btn" type="button" data-bs-dismiss="modal">
            {% translate "Cancel" %}
          </button>
          <button class="btn btn-danger" type="submit" data-attachment-delete-confirm>
            {% translate "Delete attachment" %}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
