{% load i18n %}
<form class="card card-sm tf-filter-bar mb-3"
      method="get"
      action="{% url 'journal:trades' %}"
      hx-get="{% url 'journal:trades' %}"
      hx-target="#trade-results"
      hx-swap="outerHTML"
      hx-push-url="true">
  <div class="card-body">
    <div class="row g-3 align-items-end">
      <div class="col-12 col-md">
        <label class="form-label" for="id_trade_search">
          {% translate "Search" %}
        </label>
        <input class="form-control"
               type="search"
               id="id_trade_search"
               name="q"
               value="{{ search }}"
               placeholder="{% translate 'Market, strategy, profile, or notes…' %}"
               autocomplete="off">
      </div>
      <div class="col-12 col-sm-6 col-md-auto">
        <label class="form-label" for="id_status_filter">
          {% translate "Status" %}
        </label>
        <select class="form-select" id="id_status_filter" name="status">
          <option value="">{% translate "All statuses" %}</option>
          {% for val, lbl in status_choices %}
            <option value="{{ val }}" {% if status_filter == val %}selected{% endif %}>
              {{ lbl }}
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="col-12 col-sm-6 col-md-auto">
        <label class="form-label" for="id_direction_filter">
          {% translate "Direction" %}
        </label>
        <select class="form-select" id="id_direction_filter" name="direction">
          <option value="">{% translate "All directions" %}</option>
          {% for val, lbl in direction_choices %}
            <option value="{{ val }}" {% if direction_filter == val %}selected{% endif %}>
              {{ lbl }}
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="col-12 col-sm-6 col-md-auto">
        <label class="form-label" for="id_profile_filter">
          {% translate "Profile" %}
        </label>
        <select class="form-select" id="id_profile_filter" name="profile">
          <option value="">{% translate "All profiles" %}</option>
          {% for p in profiles %}
            <option value="{{ p.pk }}" {% if profile_filter|stringformat:"s" == p.pk|stringformat:"s" %}selected{% endif %}>
              {{ p.name }}
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="col-12 col-sm-6 col-md-auto">
        <label class="form-label" for="id_strategy_filter">
          {% translate "Strategy" %}
        </label>
        <select class="form-select" id="id_strategy_filter" name="strategy">
          <option value="">{% translate "All strategies" %}</option>
          {% for s in strategies %}
            <option value="{{ s.pk }}" {% if strategy_filter|stringformat:"s" == s.pk|stringformat:"s" %}selected{% endif %}>
              {{ s.name }}
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="col-12 col-md-auto">
        <div class="btn-list flex-nowrap">
          <button class="btn btn-primary" type="submit">
            {% translate "Apply" %}
          </button>
          <a class="btn" href="{% url 'journal:trades' %}">
            {% translate "Reset" %}
          </a>
        </div>
      </div>
    </div>
  </div>
</form>
