{% load i18n %}
<form action="{% url 'journal:trade_delete' trade.pk %}"
      method="post"
      hx-post="{% url 'journal:trade_delete' trade.pk %}"
      hx-target="#trade-results"
      hx-swap="outerHTML">
  {% csrf_token %}
  <p class="text-secondary mb-4">
    {% blocktranslate with symbol=trade.venue_instrument.pair.canonical_symbol date=trade.trade_date %}
      Are you sure you want to delete the trade draft for <strong>{{ symbol }}</strong> on {{ date }}?
    {% endblocktranslate %}
  </p>
  <div class="d-flex justify-content-end gap-2">
    <button class="btn" type="button" data-bs-dismiss="modal">
      {% translate "Cancel" %}
    </button>
    <button class="btn btn-danger" type="submit">
      {% translate "Delete draft" %}
    </button>
  </div>
</form>
