{% load i18n %}
<form hx-post="{% url 'journal:wallet_add' profile.pk %}"
      hx-target="#wallet-add-body"
      hx-swap="innerHTML"
      novalidate>
  {% csrf_token %}
  {% include "tradefog/components/form_field.html" with field=form.venue_wallet_asset %}
  <div class="modal-footer px-0 pb-0">
    <button class="btn" type="button" data-bs-dismiss="modal">
      {% translate "Cancel" %}
    </button>
    <button class="btn btn-outline-primary" type="submit">
      {% translate "Add asset" %}
    </button>
  </div>
</form>
