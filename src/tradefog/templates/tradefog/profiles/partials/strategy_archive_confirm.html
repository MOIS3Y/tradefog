{% load i18n %}
<form hx-post="{% url 'journal:strategy_archive' profile.pk strategy.pk %}"
      hx-target="#strategy-archive-body"
      hx-swap="innerHTML">
  {% csrf_token %}
  <p class="mb-3">
    {% blocktranslate with name=strategy.name %}
      Archive the strategy {{ name }}? It stops appearing in new trade selection until restored.
    {% endblocktranslate %}
  </p>
  <div class="modal-footer px-0 pb-0">
    <button class="btn" type="button" data-bs-dismiss="modal">
      {% translate "Cancel" %}
    </button>
    <button class="btn btn-outline-primary" type="submit">
      {% translate "Archive" %}
    </button>
  </div>
</form>
