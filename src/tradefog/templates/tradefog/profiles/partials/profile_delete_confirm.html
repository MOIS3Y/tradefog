{% load i18n %}
<form hx-post="{% url 'journal:profile_delete' profile.pk %}"
      hx-target="#profile-delete-body"
      hx-swap="innerHTML">
  {% csrf_token %}
  <p class="mb-3">
    {% blocktranslate with name=profile.name %}
      Delete the profile {{ name }} and everything inside it?
    {% endblocktranslate %}
  </p>
  <div class="modal-footer px-0 pb-0">
    <button class="btn" type="button" data-bs-dismiss="modal">
      {% translate "Cancel" %}
    </button>
    <button class="btn btn-danger" type="submit">
      {% translate "Delete" %}
    </button>
  </div>
</form>
