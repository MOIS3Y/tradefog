{% load i18n %}
<form hx-post="{% url 'journal:profile_create' %}"
      hx-target="#profile-form-body"
      hx-swap="innerHTML"
      novalidate>
  {% csrf_token %}
  {% include "tradefog/components/form_field.html" with field=form.name %}
  {% include "tradefog/components/form_field.html" with field=form.venue %}
  <div class="modal-footer px-0 pb-0">
    <button class="btn" type="button" data-bs-dismiss="modal">
      {% translate "Cancel" %}
    </button>
    <button class="btn btn-primary" type="submit">
      {% translate "Create profile" %}
    </button>
  </div>
</form>
