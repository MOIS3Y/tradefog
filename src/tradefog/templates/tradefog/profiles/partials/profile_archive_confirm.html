{% load i18n %}
<form hx-post="{% url 'journal:profile_archive' profile.pk %}"
      hx-target="#profile-archive-body"
      hx-swap="innerHTML">
  {% csrf_token %}
  <p class="mb-3">
    {% blocktranslate with name=profile.name %}
      Archive the profile {{ name }}? Its trades and history are kept and it
      stops appearing in new trades and analytics until restored.
    {% endblocktranslate %}
  </p>
  <div class="modal-footer px-0 pb-0">
    <button class="btn" type="button" data-bs-dismiss="modal">
      {% translate "Cancel" %}
    </button>
    <button class="btn btn-primary" type="submit">
      {% translate "Archive" %}
    </button>
  </div>
</form>
