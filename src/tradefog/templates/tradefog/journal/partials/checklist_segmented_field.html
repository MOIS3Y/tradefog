<div class="btn-group w-100 tf-checklist-options" role="group" aria-label="{{ field.label }}">
  {% for choice in field %}
    {{ choice.tag }}
    <label class="btn{% if forloop.first %} btn-outline-danger{% elif forloop.last %} btn-outline-success{% else %} btn-outline-secondary{% endif %}" for="{{ choice.id_for_label }}">
      {{ choice.choice_label }}
    </label>
  {% endfor %}
</div>
{% for error in field.errors %}
  <div class="invalid-feedback d-block">{{ error }}</div>
{% endfor %}
